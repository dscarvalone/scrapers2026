name: Election night results

# Cron times are UTC. Ohio is on EST (UTC-5) on Nov 3, 2026.
# Runs every 5 min from 6:00 PM ET Nov 3 through 7:55 AM ET Nov 4.
on:
  schedule:
    - cron: "*/5 23 3 11 *"    # Nov 3, 6:00-6:55 PM ET
    - cron: "*/5 0-12 4 11 *"  # Nov 3 7:00 PM ET -> Nov 4 7:55 AM ET
  workflow_dispatch:             # "Run workflow" button for manual runs

permissions:
  contents: write                # commit updated CSVs back to the repo

concurrency:
  group: election-night
  cancel-in-progress: false

env:
  # Counties to scrape: each needs counties/<name>/scraper.py that writes
  # counties/<name>/output/summary_wide_latest.csv
  # warren and butler are NOT listed: their feed (liveresults.boe.ohio.gov,
  # the SOS-hosted ENR) serves a Cloudflare JS challenge to datacenter IPs
  # (confirmed 2026-11-01), so they would fail every run. See REPORT.md.
  COUNTIES: "cuyahoga franklin"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The cron above would fire again every November; only run in 2026
      # unless started manually.
      - name: Year guard
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      # One county failing (e.g. a changed URL) doesn't stop the others.
      - name: Scrape counties
        id: scrape
        if: steps.guard.outputs.run == 'true'
        run: |
          failed=""
          for c in $COUNTIES; do
            echo "::group::$c"
            if python -m counties.$c.scraper; then
              cp counties/$c/output/summary_wide_latest.csv counties/$c/data/summary_wide.csv
            else
              echo "::error::$c scraper failed"
              failed="$failed $c"
            fi
            echo "::endgroup::"
            sleep 1   # politeness: counties can share a host
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # County TOTALS for the 86 counties without a county scraper come from
      # results/senate_statewide_by_county.csv, and SOS-hosted counties'
      # data/summary_wide.csv files, both committed by tools/local_loop.sh
      # from a desktop. The SOS statewide site blocks GitHub's runners
      # even with a headed browser (manual run, 2026-11-01), so it can't be
      # fetched here. common.senate below merges it.

      # The deliverable: U.S. Senate results by vote method, all counties.
      # Uses each county's last good data/ file, so one failed scrape
      # doesn't drop that county from the combined file.
      - name: Build Senate results
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true   # still commit county data if this step has a problem
        run: python -m common.senate

      - name: Commit changed results
        id: commit
        if: steps.guard.outputs.run == 'true'
        run: |
          git add counties/*/data/summary_wide.csv results/
          if git diff --cached --quiet; then
            echo "No change in results."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --cached --name-only -- counties | cut -d/ -f2 | sort -u | tr '\n' ' ')
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Results update ($changed) $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report failed counties
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error::Failed counties:${{ steps.scrape.outputs.failed }}"
          exit 1
